name: validate-skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile helper scripts and tests
        run: python -m compileall -q scripts tests

      - name: Install validation dependencies
        run: python -m pip install -r requirements-tools.txt

      - name: Validate skill contracts
        run: python scripts/quick_validate.py

      - name: Validate old-problem forward contract
        run: python tests/test_old_problem_forward_contract.py

      - name: Validate competition-first contract
        run: python tests/test_competition_first_contract.py

      - name: Validate helper tools
        run: python tests/test_helper_tools.py

      - name: Validate runtime and delivery regressions
        run: python tests/test_reliability.py
