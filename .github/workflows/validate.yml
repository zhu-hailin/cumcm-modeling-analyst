name: validate-skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile helper scripts and tests
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Validate skill contracts
        run: python scripts/quick_validate.py

      - name: Validate old-problem forward contract
        run: python tests/test_old_problem_forward_contract.py

      - name: Validate competition-first contract
        run: python tests/test_competition_first_contract.py

      - name: Validate helper tools
        run: python tests/test_helper_tools.py
