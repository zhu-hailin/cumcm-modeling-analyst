name: cumcm-modeling-analyst
version: 11.2
description: >
  Competition-first router for CUMCM modeling. Keep startup light, let the agent
  explore freely inside confirmed boundaries, and load strict evidence/figure/paper
  rules only when the corresponding artifact becomes formal.

always_load:
  - references/problem-ingestion-security.md
  - references/core-workflow.md

routes:
  local_workspace:
    when: Codex or another writable local agent creates or manages project files
    load:
      - references/local-workspace-policy.md
      - references/python-code-documentation-policy.md

  stage1_modeling:
    when: semantic problem reading, mechanism exploration, EDA, baseline, candidate comparison or route selection
    load:
      - references/modeling-quality-gates.md

  question_by_question:
    when: the team chooses per-question discussion and confirmation
    load:
      - assets/QUESTION_BY_QUESTION_SOLUTION_TEMPLATE.md
      - references/modeling-quality-gates.md
      - references/model-run-ledger.md
      - references/python-code-documentation-policy.md

  one_pass:
    when: the team confirms a route and authorizes continuous solving
    load:
      - assets/STAGE2_ONE_PASS_SOLUTION_TEMPLATE.md
      - references/modeling-quality-gates.md
      - references/model-run-ledger.md
      - references/python-code-documentation-policy.md

  visualization:
    when: an exploratory, validation, paper, method or AI communication figure is planned or generated
    load:
      - references/python-visualization-policy.md

  literature_and_external_data:
    when: missing real-world data, parameters, standards, literature or external links may affect a model, validation or conclusion
    load:
      - references/external-data-research-policy.md
      - references/source-verification-policy.md
      - references/paper-evaluation-protocol.md

  formulas_and_tutorials:
    when: Markdown mathematics, DOCX/PDF equations, symbol tables or question tutorials are produced or reviewed
    load:
      - references/equation-rendering-policy.md

  blind_benchmark:
    when: an old problem is solved blindly, frozen, compared with references or improved post hoc
    load:
      - references/blind-benchmark-provenance.md
      - references/paper-evaluation-protocol.md

  paper_evidence:
    when: requirement/evidence mapping is created or updated, especially after Final/Validation Runs
    load:
      - references/paper-evidence-architecture.md
      - assets/PAPER_EVIDENCE_BLUEPRINT_TEMPLATE.md
      - references/modeling-quality-gates.md
      - references/final-consistency-sweep.md

  reference_paper:
    when: the AI-authored internal reference paper is drafted or regenerated
    load:
      - references/paper-evidence-architecture.md
      - references/reference-paper-writing.md
      - references/python-visualization-policy.md
      - references/equation-rendering-policy.md
      - references/source-verification-policy.md
      - references/final-consistency-sweep.md

  internal_delivery:
    when: the internal deliverable packages are built or normally validated
    load:
      - references/final-delivery-packaging.md
      - references/final-consistency-sweep.md

  delivery_integrity_debug:
    when: an archive is empty, corrupt, unreadable, has filename/path compatibility problems, or needs deeper cross-environment delivery diagnosis
    load:
      - references/delivery-integrity-policy.md

  final_paper_audit:
    when: the team-written paper is submitted for final review
    load:
      - references/final-paper-audit.md
      - references/final-consistency-sweep.md
      - references/paper-evidence-architecture.md
      - references/modeling-quality-gates.md
      - references/python-visualization-policy.md
      - references/equation-rendering-policy.md
      - references/source-verification-policy.md
      - assets/FINAL_PAPER_AUDIT_TEMPLATE.md

  official_submission:
    when: actual competition upload files are prepared
    load:
      - references/competition-compliance.md
      - references/official-submission-policy.md
      - references/final-consistency-sweep.md

principles:
  - Audit the initially received problem and official attachments once before semantic reading; after INGESTION_SECURITY_AUDIT_LOCKED, reuse the saved audit and never repeat or incrementally audit later materials unless the user explicitly requests it or a new problem workspace begins.
  - Inside a confirmed route, the agent may autonomously run EDA, diagnostic experiments, tuning, solver changes, validation and pre-approved fallback routes; ask the user only when objectives, key constraints, conclusion-changing assumptions, unresolved data gaps or other team-level modeling decisions change.
  - QUALITY_GATES_ARE_AUDITORS_NOT_MODEL_SELECTORS: explore mechanisms and plausible models before auditing them.
  - Never fabricate observations, parameters, runs, results, citations or source status; every final result points to a real FINAL_RUN_ID.
  - Exploratory artifacts stay lightweight; full traceability and publication QA are required only when an artifact becomes formal evidence.
  - Build the requirement/evidence skeleton incrementally, freeze it after Final/Validation Runs, and draft the full reference paper only after PAPER_EVIDENCE_BLUEPRINT_READY.
