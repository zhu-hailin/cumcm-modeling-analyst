name: cumcm-modeling-analyst
version: "12.0"
description: >
  Per-question modeling, evidence-led writing and usable delivery for CUMCM.
  Choose SINGLE or THREE_ROLE once per full project; develop arguments and
  Python figures during solving, with nature-figure as the figure authority.

always_load:
  - references/core-workflow.md

external_dependencies:
  nature_figure:
    repository: https://github.com/Yuan1z0825/nature-skills
    skill_path: skills/nature-figure/SKILL.md
    verified_commit: 9e2d90e2171a61dc0ae072e43e8d16e3fc73572f
    verified_version: "2.8.0"
    backend: python
    required_for: paper figures and tables generated during each question
    adapter: references/python-visualization-policy.md

routes:
  link_bootstrap:
    when: user starts with the repository URL, or prepares missing skill dependencies for a full project
    load:
      - references/link-bootstrap.md

  multi_agent:
    when: THREE_ROLE is selected, existing three-role coordination resumes, or the user changes collaboration mode; never enable subagents merely because this route exists
    load:
      - references/multi-agent-collaboration.md
      - assets/SUBAGENT_TASK_TEMPLATE.md

  initial_ingestion:
    when: first attached problem-package intake, continuation of its incomplete initial audit, or an explicit user request to re-audit; no file audit for an attachment-free text exercise, and never a routine trigger for later materials or question switches
    load:
      - references/problem-ingestion-security.md

  local_workspace:
    when: Codex or another writable local agent creates or manages project files
    load:
      - references/local-workspace-policy.md

  stage1_modeling:
    when: semantic problem reading, mechanism exploration, EDA, baseline, candidate comparison or route selection
    load:
      - references/modeling-research-playbook.md
      - references/modeling-quality-gates.md

  question_by_question:
    when: any Stage 2 solving task; present and confirm the current question plan, solve it, then pause before the next question
    load:
      - assets/QUESTION_BY_QUESTION_SOLUTION_TEMPLATE.md
      - references/modeling-quality-gates.md
      - references/model-run-ledger.md
      - references/python-code-documentation-policy.md

  visualization:
    when: plan, generate, promote, revise or audit figures or tables for paper evidence during a question; temporary EDA plots alone do not load publication QA
    load:
      - references/python-visualization-policy.md

  literature_and_external_data:
    when: missing real-world data, parameters, standards, literature or external links may affect a model, validation or conclusion
    load:
      - references/external-data-research-policy.md
      - references/source-verification-policy.md

  paper_review:
    when: the user requests paper evaluation or transferable research-design lessons, or a substantive paper comparison will change the current modeling decision
    load:
      - references/source-verification-policy.md
      - references/paper-evaluation-protocol.md

  formulas_and_tutorials:
    when: Markdown mathematics, DOCX/PDF equations, symbol tables or question tutorials are produced or reviewed
    load:
      - references/equation-rendering-policy.md

  blind_benchmark:
    when: an old problem is solved blindly, frozen, compared with references or improved post hoc
    load:
      - references/blind-benchmark-provenance.md

  paper_evidence:
    when: maintain a cross-question evidence index with actual evidence references; early outline or a compact single-question handoff alone does not trigger this route
    load:
      - references/paper-evidence-architecture.md
      - assets/PAPER_EVIDENCE_BLUEPRINT_TEMPLATE.md

  evidence_freeze:
    when: freeze the completed evidence blueprint after Final/Validation Runs and formal figures; inspect existing evidence without requiring an unwritten paper
    load:
      - references/paper-evidence-architecture.md
      - references/modeling-quality-gates.md
      - references/final-consistency-sweep.md

  live_competition:
    when: actual competition work begins; check applicable AI boundaries and start the truthful AI usage log
    load:
      - references/competition-compliance.md
      - assets/AI_USAGE_LOG_TEMPLATE.md

  paper_outline:
    when: organize the early paper thread, question relationships and evidence gaps; does not require full writing, rendering or delivery rules
    load:
      - assets/PAPER_OUTLINE_TEMPLATE.md

  reference_paper:
    when: write or revise manuscript chapters using available model derivations and verified results; outline-only work uses paper_outline
    load:
      - references/reference-paper-writing.md

  document_rendering:
    when: create or inspect Word/LaTeX/PDF document output and equation rendering; plain outline or chapter prose does not trigger this route
    load:
      - references/equation-rendering-policy.md

  internal_delivery:
    when: select or update formal evidence or delivery artifacts, invalidate their dependencies, or resume pending delivery synchronization; temporary EDA, tuning or intermediate files alone do not trigger it
    load:
      - references/final-delivery-packaging.md
      - assets/DELIVERY_README_TEMPLATE.md

  delivery_integrity_debug:
    when: an archive is empty, corrupt, unreadable, has filename/path compatibility problems, or needs deeper cross-environment delivery diagnosis
    load:
      - references/delivery-integrity-policy.md

  final_paper_audit:
    when: the team-written paper is submitted for final review
    load:
      - references/final-paper-audit.md
      - references/abstract-and-argumentation.md
      - references/final-consistency-sweep.md
      - references/paper-evidence-architecture.md
      - references/modeling-quality-gates.md
      - references/python-visualization-policy.md
      - references/equation-rendering-policy.md
      - references/source-verification-policy.md
      - assets/FINAL_PAPER_AUDIT_TEMPLATE.md

  official_submission:
    when: actual competition upload files are prepared
    load:
      - references/competition-compliance.md
      - references/official-submission-policy.md
      - references/final-consistency-sweep.md

  delivery_validation:
    when: validate a final directory or requested archive for handoff; not every update to a selected artifact
    load:
      - references/final-delivery-packaging.md
      - references/final-consistency-sweep.md

  abstract_revision:
    when: draft, revise or independently read an abstract or its argument; retain the team's own effective expression and verify claims against existing evidence
    load:
      - references/abstract-and-argumentation.md

principles:
  - Rules live in their authority documents; this manifest selects resources and does not define a second workflow.
  - Load only the routes needed now; links are available references, not an instruction to recursively read all linked files.
