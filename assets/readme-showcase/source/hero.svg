    <radialGradient id="glow"><stop stop-color="#237C83" stop-opacity=".34"/><stop offset="1" stop-color="#237C83" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#66E4C3"/><stop offset="1" stop-color="#9BE9F6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#96C5D6" stroke-opacity=".065"/></pattern>
    <style>
      text{font-family:'Noto Sans CJK SC',sans-serif;fill:#F4F8FC}
      .muted{fill:#AFC2D0}.mint{fill:#7BE6C8}.bold{font-weight:700}
      .stroke{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.5}
    </style>
  </defs>
  <rect width="1440" height="660" rx="28" fill="url(#background)"/>
  <rect x="820" y="32" width="584" height="442" rx="20" fill="url(#grid)"/>
