<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">CUMCM Modeling Analyst — 让建模思路成为可信成果</title>
  <desc id="desc">面向数学建模竞赛的 AI 协作 Skill。全题理解、逐题确认、真实求解、证据驱动写作。右侧为模型与证据的抽象示意，不含实测结果。</desc>
  <defs>
