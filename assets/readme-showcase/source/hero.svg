  <text x="1294" y="82" text-anchor="middle" font-size="18" class="mint bold">SKILL 11.4</text>

  <text id="headline-1" x="72" y="199" font-size="66" class="bold">让建模思路</text>
  <text id="headline-2" x="72" y="289" font-size="66" font-weight="700" fill="url(#accent)" style="fill:url(#accent)">成为可信成果。</text>
  <text x="76" y="357" font-size="31" class="bold">CUMCM Modeling Analyst</text>
  <text x="76" y="405" font-size="23" class="muted">从题目理解到参考论文，逐步形成可复核的答案。</text>
