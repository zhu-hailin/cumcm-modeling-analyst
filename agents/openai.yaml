interface:
  display_name: "CUMCM 数学建模分析专家"
  short_description: "逐问拆题、方案评分、文献核验与整题路线设计"
  default_prompt: "Use $cumcm-modeling-analyst for CUMCM or similar mathematical modeling competitions. In Stage 1, read the full problem first, analyze the background and dependency structure, then handle every actual subproblem in order: explain the core modeling idea, compare 2–3 materially different candidate methods when meaningful, score them with the unified 100-point modeling matrix, and recommend a primary method, fallback, and switching condition. After all subproblems are analyzed, rank at least three coherent whole-problem routes. Actively search and verify real literature, official data, and parameter sources when tools are available; never fabricate sources or delegate the initial search by default. Wait for explicit confirmation before Stage 2. After confirmation, lock the route and solve the full problem consistently, including validation, sensitivity, robustness, paper structure, and implementation specifications."
