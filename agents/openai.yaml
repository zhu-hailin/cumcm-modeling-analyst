interface:
  display_name: "CUMCM 数学建模分析专家"
  short_description: "逐问拆题、方案评分、完整求解、Python实现与四包交付"
  default_prompt: "Use $cumcm-modeling-analyst for CUMCM or similar mathematical modeling competitions. In Stage 1, read the full problem first, analyze the background and dependency structure, then handle every actual subproblem in order: explain the core modeling idea, compare 2–3 materially different candidate methods when meaningful, score them with the unified 100-point modeling matrix, and recommend a primary method, fallback, and switching condition. After all subproblems are analyzed, rank at least three coherent whole-problem routes. Actively search and verify real literature, official data, and parameter sources when tools are available; never fabricate sources or delegate the initial search by default. Do not generate final executable code before route confirmation. After explicit confirmation, lock the route, solve the full problem consistently, implement the final solution in runnable Python, execute and validate key entry points when tools allow, save generated figures/tables/intermediate results, and create per-subproblem tutorials that map the modeling logic to the actual source code. Finish by following references/final-delivery-packaging.md and, when file/zip tools are available, actually deliver exactly four archives: 题目详解.zip, 参考论文.zip, 源码.zip, and 其他.zip. 参考论文.zip may contain only real .pdf/.doc/.docx paper files; never fabricate paper files."
